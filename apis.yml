aid: apache-storm
name: Apache Storm
description: >-
  Apache Storm is a free and open-source distributed real-time computation system that makes it easy to reliably process
  unbounded streams of data at scale. It provides a simple programming model (topologies with spouts and bolts),
  guaranteed message processing, horizontal scalability, and fault tolerance. Storm integrates with queuing and database
  technologies including Apache Kafka and Apache Cassandra and is governed by the Apache Software Foundation.
